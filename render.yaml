services:
  - type: web
    name: dsa-visualizer-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build && node scripts/build_cpp.js && npm --prefix server install
    startCommand: node server/index.js
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: CORS_ORIGIN
        value: "*"

  - type: web
    name: dsa-visualizer-web
    runtime: static
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://dsa-visualizer-api.onrender.com
